<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b32">
<meta name="description" content="نصب نسخه همراه پنل مدیریت پیوندگستر پارسان">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/admin-install/manifest.webmanifest">
<link rel="icon" href="/admin-install/icon.svg" type="image/svg+xml">
<title>نصب اپلیکیشن مدیریت | پیوندگستر پارسان</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6f4;color:#18332c;font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
main{width:min(100%,440px);background:#fff;border-radius:24px;padding:30px 24px;text-align:center;box-shadow:0 12px 40px #153b3020}
.logo{width:92px;height:92px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#123b32;color:white;font-size:38px;font-weight:bold}
h1{font-size:22px;margin:8px 0 12px}p{font-size:14px;line-height:2;color:#52645e;margin:8px 0 20px}
button,.link{display:block;width:100%;border:0;border-radius:13px;background:#17634e;color:#fff;font-size:16px;font-weight:bold;padding:15px;cursor:pointer;text-decoration:none;margin-top:12px}
.secondary{background:#e8f0ec;color:#164b3b}.note{font-size:12px;color:#75847e;margin-top:18px}#status{margin-top:14px;color:#17634e;font-size:13px;line-height:1.9;white-space:pre-line}
</style>
</head>
<body>
<main>
<div class="logo">م</div>
<h1>اپلیکیشن مدیریت سامانه</h1>
<p>نسخه مستقل مدیر سامانه پیوندگستر پارسان</p>
<button id="install" type="button" onclick="window.installManagementApp()">نصب اپلیکیشن مدیریت</button>
<a class="link secondary" href="/management/">ورود به پنل مدیریت</a>
<div id="status">اگر پنجره نصب باز نشد، از منوی سه‌نقطه Chrome گزینه «افزودن به صفحه اصلی» یا «Install app» را انتخاب کنید.</div>
<div class="note">این نسخه مخصوص مدیر سامانه است و با نسخه گلخانه‌دار و کارشناس تفاوت دارد.</div>
</main>
<script>
(function(){
  var promptEvent=null;
  var button=document.getElementById('install');
  var status=document.getElementById('status');
  function message(t){status.textContent=t;}
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    promptEvent=e;
    button.textContent='نصب اپلیکیشن مدیریت';
    message('آماده نصب است. دکمه نصب را انتخاب کنید.');
  });
  window.installManagementApp=async function(){
    message('در حال بررسی امکان نصب…');
    if(promptEvent){
      try{
        await promptEvent.prompt();
        var choice=await promptEvent.userChoice;
        message(choice.outcome==='accepted'?'درخواست نصب پذیرفته شد.':'درخواست نصب لغو شد.');
      }catch(err){message('نصب خودکار در این مرورگر در دسترس نیست. از منوی سه‌نقطه Chrome گزینه «افزودن به صفحه اصلی» را انتخاب کنید.');}
      promptEvent=null;
    }else{
      message('نصب خودکار در حال حاضر از سوی Chrome ارائه نشده است. منوی سه‌نقطه Chrome را باز کنید و «افزودن به صفحه اصلی» یا «Install app» را بزنید.');
    }
  };
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('/admin-install/sw.js',{scope:'/admin-install/'}).catch(function(){
        message('صفحه نصب باز است، اما ثبت سرویس نصب انجام نشد. برای نصب دستی از منوی سه‌نقطه Chrome استفاده کنید.');
      });
    });
  }
})();
</script>
</body>
</html>
