<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123d35"><title>پذیرش دعوت گلخانه‌دار</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172b27;background:#f3f6f5}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
main{width:min(100%,520px)}.card{background:#fff;border:1px solid #e1e9e6;border-radius:16px;padding:24px;box-shadow:0 4px 18px #173b3010}
h1{font-size:20px;margin:0 0 12px;color:#123d35}p{font-size:14px;line-height:2;color:#52645e}
label{display:block;font-size:13px;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd8d3;border-radius:9px;font:inherit}
button{margin-top:18px;font:inherit;border:0;border-radius:9px;padding:12px 18px;background:#176b57;color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.notice{padding:12px;border-radius:9px;background:#edf5f1;color:#174b3e;margin-top:16px;font-size:13px;line-height:1.9;white-space:pre-wrap}
.error{background:#fff0ef;color:#8b2828}.hidden{display:none!important}
</style></head><body><main><section class="card">
<h1>تکمیل ثبت‌نام گلخانه‌دار</h1>
<p>به سامانه مشاوره گلخانه پیوندگستر پارسان دعوت شده‌اید. برای تکمیل ثبت‌نام، گذرواژه حساب خود را تعیین کنید. پس از آن، حساب شما برای تأیید مدیر سامانه در وضعیت انتظار قرار می‌گیرد.</p>
<div id="form-area" class="hidden"><form id="accept-form">
<label for="password">گذرواژه جدید</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="حداقل ۸ نویسه">
<label for="password2">تکرار گذرواژه</label><input id="password2" type="password" minlength="8" autocomplete="new-password" required>
<button id="submit" type="submit">ثبت گذرواژه و تکمیل ثبت‌نام</button>
</form></div>
<p id="status" class="notice">در حال بررسی اعتبار دعوت‌نامه…</p>
</section></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.58.0";
const supabase=createClient("https://tnfunhkxnldrylwbxraf.supabase.co","sb_publishable_f6K92sAcoynWBRGevrTrJA_TsSj73sH");
const $=id=>document.getElementById(id);
function status(t,error=false){$("status").textContent=t;$("status").classList.toggle("error",error);}
const {data:{session},error}=await supabase.auth.getSession();
if(error){status("بررسی دعوت‌نامه ناموفق بود: "+error.message,true);}
else if(session?.user){$("form-area").classList.remove("hidden");status("دعوت‌نامه معتبر است. گذرواژه خود را تعیین کنید.");}
else{const p=new URLSearchParams(location.hash.slice(1));status(p.get("error_description")||"نشست معتبر دعوت پیدا نشد. از مدیر سامانه بخواهید دعوت‌نامه جدیدی ارسال کند.",true);}
$("accept-form").addEventListener("submit",async e=>{
e.preventDefault();const a=$("password").value,b=$("password2").value;
if(a.length<8){status("گذرواژه باید دست‌کم ۸ نویسه داشته باشد.",true);return;}
if(a!==b){status("گذرواژه و تکرار آن یکسان نیستند.",true);return;}
$("submit").disabled=true;const {error}=await supabase.auth.updateUser({password:a});$("submit").disabled=false;
if(error){status("ثبت گذرواژه انجام نشد: "+error.message,true);return;}
$("form-area").classList.add("hidden");$("password").value="";$("password2").value="";
status("ثبت‌نام اولیه با موفقیت انجام شد. حساب شما اکنون در انتظار تأیید مدیر سامانه است. پس از تأیید می‌توانید وارد سامانه شوید.");
await supabase.auth.signOut();
});
</script></body></html>
