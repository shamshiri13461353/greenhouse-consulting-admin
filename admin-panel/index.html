<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d35">
  <title>پنل مدیریت سامانه مشاوره گلخانه</title>
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;color:#172b27;background:#f3f6f5}
    *{box-sizing:border-box}body{margin:0}header{background:#123d35;color:#fff;padding:22px max(18px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    header h1{font-size:20px;margin:0}main{max-width:1080px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 20px #123d3510;margin-bottom:18px}
    input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #ccd8d3}button{background:#17634e;color:#fff;border:0;cursor:pointer;font-weight:bold}input{width:100%;margin:8px 0 14px}label{display:block;font-size:14px}
  </style>
</head>
<body>
<header><h1>پنل مدیریت سامانه مشاوره گلخانه</h1></header>
<main><section class="card"><h2>ورود مدیر سامانه</h2><p>برای ورود، از فرم ورود مدیریت استفاده کنید.</p><div id="app"></div></section></main>
</body>
</html>
