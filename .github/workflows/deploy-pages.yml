name: Deploy admin, grower, expert and mobile portals to GitHub Pages
# Mobile PWA is published with its own /mobile/sw.js worker and /mobile/ scope.

on:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"
      - "management/**"
      - "grower/**"
      - "expert/**"
      - "mobile/**"
      - "users/**"
      - "sw.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax-check all portal modules and service worker
        run: |
          python3 - <<'PY'
          import re, pathlib
          portals = {
              "admin-panel/index.html": "admin-panel",
              "grower/index.html": "grower",
              "expert/index.html": "expert",
              "mobile/index.html": "mobile",
              "users/index.html": "users",
          }
          for source, name in portals.items():
              html = pathlib.Path(source).read_text()
              scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"Expected exactly one module script in {source}")
              pathlib.Path(f"/tmp/{name}.mjs").write_text(scripts[0])
          PY
          node --check /tmp/admin-panel.mjs
          node --check /tmp/grower.mjs
          node --check /tmp/expert.mjs
          node --check /tmp/mobile.mjs
          node --check management/sw.js
          node --check /tmp/users.mjs
          node --check sw.js
          node --check expert/sw.js
          python3 -m json.tool mobile/manifest.webmanifest > /dev/null
          python3 -m json.tool management/manifest.webmanifest > /dev/null
      - name: Download pinned Supabase browser bundle
        run: |
          TGZ="$(npm pack --silent @supabase/supabase-js@2.58.0 --pack-destination /tmp)"
          mkdir -p /tmp/supabase-sdk
          tar -xzf "/tmp/$TGZ" -C /tmp/supabase-sdk
          test -s /tmp/supabase-sdk/package/dist/umd/supabase.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/admin-panel _site/management/icons _site/grower _site/expert _site/mobile/icons _site/users _site/admin-install
          cp admin-panel/index.html _site/index.html
          cp admin-panel/index.html _site/admin-panel/index.html
          # /management/ remains the stable URL and PWA start URL, but serves the single canonical admin portal.
          cp admin-panel/index.html _site/management/index.html
          # Restore the stable PWA manifest association on the shared admin portal.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("_site/management/index.html")
          html = page.read_text()
          marker = '  <meta name="theme-color" content="#123d35">\n'
          if marker not in html:
              raise SystemExit("Management portal theme-color marker not found")
          html = html.replace(marker, marker + '  <link rel="manifest" href="/management/manifest.webmanifest">\n  <link rel="icon" href="/management/icons/icon-192.png" type="image/png">\n', 1)
          # Render the install control in the HTML itself so it is visible even before JavaScript initializes.
          install_button = '<button id="management-install-button" type="button" style="margin:0 8px;padding:10px 14px;border:0;border-radius:9px;background:#e5f1ec;color:#174b3e;font:inherit;cursor:pointer">نصب اپلیکیشن مدیریت</button>'
          if 'id="management-install-button"' not in html:
              html = html.replace('<header>', '<header>\n  ' + install_button, 1)
          # Register a service worker whose scope exactly matches the management PWA route.
          install_script = """<script>
          (() => {
            let deferredPrompt = null;
            const addInstallButton = () => {
              const button = document.getElementById('management-install-button');
              if (!button || button.dataset.installBound === 'true') return;
              button.dataset.installBound = 'true';
              button.addEventListener('click', async () => {
                if (!deferredPrompt) {
                  alert('برای نصب، صفحه را در Microsoft Edge باز کنید و از منوی سه‌نقطه، Apps و سپس Install this site as an app را انتخاب کنید. اگر این گزینه نمایش داده نمی‌شود، صفحه را یک‌بار تازه‌سازی کنید.');
                  return;
                }
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                deferredPrompt = null;
                button.hidden = true;
                if (choice.outcome === 'accepted') button.textContent = 'درخواست نصب پذیرفته شد';
              });
            };
            window.addEventListener('beforeinstallprompt', event => {
              event.preventDefault();
              deferredPrompt = event;
              addInstallButton();
            });
            window.addEventListener('appinstalled', () => {
              const button = document.getElementById('management-install-button');
              if (button) { button.textContent = 'اپلیکیشن نصب شد'; button.disabled = true; }
              deferredPrompt = null;
            });
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addInstallButton);
            else addInstallButton();
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.register('/management/sw.js', {scope:'/management/'}).catch(error => console.error('Management PWA service worker:', error));
            }
          })();
          </script>"""
          html = html.replace('</head>', install_script + '\\n</head>', 1)
          page.write_text(html)
          admin = Path("_site/admin-panel/index.html").read_text()
          import re
          scripts = lambda value: re.findall(r'<script type="module">(.*?)</script>', value, re.S)
          if scripts(admin) != scripts(html):
              raise SystemExit("Admin portal module differs between canonical and management routes")
          PY
          # Keep the old install URL as a redirect only; /management/ owns the sole admin PWA manifest.
          cp admin-panel/admin-install/index.html _site/admin-install/index.html
          cp admin-panel/accept-invitation.html _site/accept-invitation.html
          cp admin-panel/accept-grower-invitation.html _site/accept-grower-invitation.html
          cp management/install.html _site/management/install.html
          cp management/manifest.webmanifest _site/management/manifest.webmanifest
          cp management/sw.js _site/management/sw.js
          cp management/accept-invitation.html _site/management/accept-invitation.html
          cp management/accept-grower-invitation.html _site/management/accept-grower-invitation.html
          cp grower/index.html _site/grower/index.html
          cp expert/index.html _site/expert/index.html
          cp expert/sw.js _site/expert/sw.js
          cp mobile/index.html _site/mobile/index.html
          cp mobile/sw.js _site/mobile/sw.js
          cp users/index.html _site/users/index.html
          cp mobile/manifest.webmanifest _site/mobile/manifest.webmanifest
          cp mobile/icons/icon.svg _site/mobile/icons/icon.svg
          cp management/icons/icon.svg _site/management/icons/icon.svg
          python3 -m pip install --quiet CairoSVG
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="mobile/icons/icon.svg", write_to="_site/mobile/icons/icon-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url="mobile/icons/icon.svg", write_to="_site/mobile/icons/icon-512.png", output_width=512, output_height=512)
          # Derive management PNG icons from the exact approved shield SVG, not a separately drawn approximation.
          cairosvg.svg2png(url="management/icons/icon.svg", write_to="_site/management/icons/icon-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url="management/icons/icon.svg", write_to="_site/management/icons/icon-512.png", output_width=512, output_height=512)
          PY
          cp sw.js _site/sw.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/users/supabase.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/management/supabase.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/grower/supabase.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/expert/supabase.js
          cmp -s _site/index.html _site/admin-panel/index.html
          cp /tmp/supabase-sdk/package/LICENSE _site/supabase-js-LICENSE.txt
          touch _site/.nojekyll
          printf '%s\n' 'app.peyvandgostar.com' > _site/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
