name: Deploy admin, grower and expert portals to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"
      - "grower/**"
      - "expert/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax-check admin portal
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("admin-panel/index.html").read_text()
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one admin module script")
          pathlib.Path("/tmp/admin-panel.mjs").write_text(scripts[0])
          PY
          node --check /tmp/admin-panel.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/grower _site/expert
          cp admin-panel/index.html _site/index.html
          cp admin-panel/accept-invitation.html _site/accept-invitation.html
          cp admin-panel/accept-grower-invitation.html _site/accept-grower-invitation.html
          cp grower/index.html _site/grower/index.html
          cp expert/index.html _site/expert/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
