name: Deploy admin, grower, expert and mobile portals to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"
      - "management/**"
      - "grower/**"
      - "expert/**"
      - "mobile/**"
      - "users/**"
      - "sw.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax-check all portal modules and service worker
        run: |
          python3 - <<'PY'
          import re, pathlib
          portals = {
              "admin-panel/index.html": "admin-panel",
              "grower/index.html": "grower",
              "expert/index.html": "expert",
              "mobile/index.html": "mobile",
              "users/index.html": "users",
          }
          for source, name in portals.items():
              html = pathlib.Path(source).read_text()
              scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"Expected exactly one module script in {source}")
              pathlib.Path(f"/tmp/{name}.mjs").write_text(scripts[0])
          PY
          node --check /tmp/admin-panel.mjs
          node --check /tmp/grower.mjs
          node --check /tmp/expert.mjs
          node --check /tmp/mobile.mjs
          node --check admin-panel/admin-install/sw.js
          node --check /tmp/users.mjs
          node --check sw.js
          python3 -m json.tool mobile/manifest.webmanifest > /dev/null
          python3 -m json.tool admin-panel/admin-install/manifest.webmanifest > /dev/null
      - name: Download pinned Supabase browser bundle
        run: |
          TGZ="$(npm pack --silent @supabase/supabase-js@2.58.0 --pack-destination /tmp)"
          mkdir -p /tmp/supabase-sdk
          tar -xzf "/tmp/$TGZ" -C /tmp/supabase-sdk
          test -s /tmp/supabase-sdk/package/dist/umd/supabase.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/admin-panel _site/management _site/grower _site/expert _site/mobile/icons _site/users _site/admin-install
          cp admin-panel/index.html _site/index.html
          cp admin-panel/index.html _site/admin-panel/index.html
          cp admin-panel/admin-install/index.html _site/admin-install/index.html
          cp admin-panel/admin-install/manifest.webmanifest _site/admin-install/manifest.webmanifest
          cp admin-panel/admin-install/sw.js _site/admin-install/sw.js
          cp admin-panel/admin-install/icon.svg _site/admin-install/icon.svg
          cp admin-panel/accept-invitation.html _site/accept-invitation.html
          cp admin-panel/accept-grower-invitation.html _site/accept-grower-invitation.html
          cp management/index.html _site/management/index.html
          cp management/accept-invitation.html _site/management/accept-invitation.html
          cp management/accept-grower-invitation.html _site/management/accept-grower-invitation.html
          cp grower/index.html _site/grower/index.html
          cp expert/index.html _site/expert/index.html
          cp mobile/index.html _site/mobile/index.html
          cp users/index.html _site/users/index.html
          cp mobile/manifest.webmanifest _site/mobile/manifest.webmanifest
          cp mobile/icons/icon.svg _site/mobile/icons/icon.svg
          cp sw.js _site/sw.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/users/supabase.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/grower/supabase.js
          cp /tmp/supabase-sdk/package/dist/umd/supabase.js _site/expert/supabase.js
          cp /tmp/supabase-sdk/package/LICENSE _site/supabase-js-LICENSE.txt
          touch _site/.nojekyll
          printf '%s\n' 'app.peyvandgostar.com' > _site/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
